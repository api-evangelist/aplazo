aid: aplazo
name: Aplazo
description: >-
  Aplazo is a Mexican buy now, pay later (BNPL) payment platform that lets
  shoppers split online and in-store purchases into installments without a
  credit card, paying over time directly from their bank account. For merchants,
  Aplazo exposes a REST payment API (api.aplazo.mx) and official e-commerce
  plugins (Magento 2, VTEX, Shopify, PrestaShop, Tiendanube) to originate loans
  at checkout, retrieve loan status, and process refunds and cancellations.
  Merchants authenticate with an apiToken and merchantId to obtain a short-lived
  JWT bearer token, then create loans that redirect the customer to Aplazo to
  complete financing. Aplazo is backed by QED Investors and operates in Mexico,
  settling in Mexican pesos (MXN).
